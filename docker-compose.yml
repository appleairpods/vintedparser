services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: vinted
      POSTGRES_PASSWORD: vinted
      POSTGRES_DB: vinted
    ports:
      # Наружу — чтобы подключаться из pgAdmin и запускать приложение без докера.
      # 5433, а не 5432: на машине уже может стоять свой PostgreSQL.
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vinted -d vinted"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  bot:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://vinted:vinted@postgres:5432/vinted
    # Миграции применяются при каждом старте: схема и код всегда едут вместе
    command: sh -c "alembic upgrade head && exec python -m app.main"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
